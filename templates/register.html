<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; }
        h2 { color: #2c4c3b; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #d35400; }
        a { display: block; text-align: center; margin-top: 15px; color: #2c4c3b; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Регистрация</h2>
        <form action="/api/register" method="POST">
            <input type="text" name="name" placeholder="Ваше имя: " required>
            <input type="tel" name="phone" placeholder="Телефон: " required>
            <input type="password" name="password" placeholder="Пароль: " required>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <a href="/">На главную</a>
    </div>
</body>
</html>
